version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: vitta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitta
      POSTGRES_USER: vitta
      POSTGRES_PASSWORD: vittapassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitta"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
