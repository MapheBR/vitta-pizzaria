services:
  - type: web
    name: vitta-pizzaria
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: vitta-db
          property: connectionString
      - key: MANUS_PROJECT_ID
        sync: false
      - key: MANUS_JWT_SECRET
        generateValue: true
      - key: MANUS_OAUTH_API_URL
        value: https://oauth.manus.com
      - key: MANUS_API_URL
        value: https://api.manus.com
      - key: MANUS_API_KEY
        sync: false

databases:
  - name: vitta-db
    databaseName: vitta
    user: vitta
    plan: free
